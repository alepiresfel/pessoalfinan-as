<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F4F5F6">
<meta name="robots" content="noindex, nofollow">
<title>Finanças pessoais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%236E747F'/%3E%3Cpath fill='white' d='M5 19h3V11H5v8zm5.5 0h3V5h-3v14zm5.5 0h3v-5.5h-3V19z'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;margin:0;padding:0}
  html{font-size:var(--fs,16px)}
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;letter-spacing:-.006em;color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  input,select,textarea,button{font-family:inherit;font-size:1rem;color:inherit}
  ::placeholder{color:var(--muted);opacity:.7}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:rgba(120,124,132,.32);border-radius:20px}
  ::-webkit-scrollbar-track{background:transparent}
  :root{
    --bg:#F7F8F9;
    --card:#FFFFFF;
    --card-2:#FFFFFF;
    --stroke:#E3E6EA;
    --ink:#1F2329;--muted:#6E747E;
    --pink:#4C525C;--pink-deep:#2C3038;--pink-soft:#EFF1F3;
    --coral:#6E747F;--mustard:#9AA0AA;--plum:#5E646E;
    --pos:#2F9E6B;--pos-bg:rgba(47,158,107,.10);
    --neg:#DC5A50;--neg-bg:rgba(220,90,80,.10);
    --warn:#C08A2E;--warn-bg:rgba(192,138,46,.12);
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --r:12px;
  }
  [data-motion="reduced"] *{animation-duration:.001ms!important;transition-duration:.001ms!important}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  a{color:var(--pink-deep)}a:hover{color:var(--pink)}

#groovy-root { min-height: 100vh; background: var(--bg); background-attachment: fixed; }
#boot-fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 500 .9rem/1.6 Inter, system-ui, sans-serif; color: #6E747F; pointer-events: none; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-fallback">Carregando…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin></script>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
  (function () {
    var tries = 0;
    (function check() {
      var fb = document.getElementById('boot-fallback');
      if (!fb) return;
      if (document.getElementById('root').childElementCount) { fb.remove(); return; }
      if (++tries > 60) { fb.textContent = 'Não consegui carregar o aplicativo. Confira sua conexão e recarregue a página.'; return; }
      setTimeout(check, 150);
    })();
  })();
</script>
</body>
</html>
